<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="520" viewBox="0 0 1060 520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Small findings add up to one alert"><title>Small findings add up to one alert</title><rect width="1060" height="520" rx="12" fill="#1a1a19"/><text x="24" y="36" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">Small findings add up to one alert</text><text x="24" y="60" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="start">One account, one morning (illustrative). Points are the rules' real scores; each finding fades with a 3-day half-life.</text><line x1="70" y1="330.0" x2="1030" y2="330.0" stroke="#2e2e2c" stroke-width="1"/><text x="60" y="334.0" font-size="11.5" font-weight="400" fill="#9a998f" text-anchor="end">0</text><line x1="70" y1="240.0" x2="1030" y2="240.0" stroke="#2e2e2c" stroke-width="1"/><text x="60" y="244.0" font-size="11.5" font-weight="400" fill="#9a998f" text-anchor="end">50</text><line x1="70" y1="150.0" x2="1030" y2="150.0" stroke="#2e2e2c" stroke-width="1"/><text x="60" y="154.0" font-size="11.5" font-weight="400" fill="#9a998f" text-anchor="end">100</text><text x="60" y="82" font-size="11.5" font-weight="400" fill="#9a998f" text-anchor="end">risk</text><text x="207.14285714285714" y="350" font-size="11.5" font-weight="400" fill="#9a998f" text-anchor="middle">09:00</text><text x="481.4285714285714" y="350" font-size="11.5" font-weight="400" fill="#9a998f" text-anchor="middle">10:00</text><text x="755.7142857142858" y="350" font-size="11.5" font-weight="400" fill="#9a998f" text-anchor="middle">11:00</text><text x="1030.0" y="350" font-size="11.5" font-weight="400" fill="#9a998f" text-anchor="middle">12:00</text><line x1="70" y1="150.0" x2="1030" y2="150.0" stroke="#c3c2b7" stroke-width="1.2" stroke-dasharray="6 5"/><text x="78" y="142.0" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">alert threshold: 100 points</text><path d="M70.0,330.0 L170.6,330.0 L170.6,276.0 L198.0,276.0 L198.0,258.1 L390.0,258.1 L390.0,213.5 L572.9,213.5 L572.9,160.3 L824.3,160.3 L824.3,116.8 L1030.0,116.8" fill="none" stroke="#3987e5" stroke-width="2" stroke-linejoin="round"/><circle cx="170.6" cy="276.0" r="10" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/><text x="170.6" y="280.0" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><circle cx="198.0" cy="258.1" r="10" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/><text x="198.0" y="262.1" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><circle cx="390.0" cy="213.5" r="10" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/><text x="390.0" y="217.5" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><circle cx="572.9" cy="160.3" r="10" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/><text x="572.9" y="164.3" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><circle cx="824.3" cy="116.8" r="10" fill="#d03b3b" stroke="#1a1a19" stroke-width="2"/><text x="824.3" y="120.8" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">5</text><text x="806.2857142857142" y="112.77141681819742" font-size="12.5" font-weight="650" fill="#ffffff" text-anchor="end">UBA alert: 118 points,</text><text x="806.2857142857142" y="128.77141681819742" font-size="12.5" font-weight="650" fill="#ffffff" text-anchor="end">with all five findings as its story</text><circle cx="80" cy="368" r="9" fill="#3987e5"/><text x="80" y="372" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="98" y="372" font-size="12.5" font-weight="400" fill="#9a998f" text-anchor="start">08:52</text><text x="144" y="372" font-size="12.5" font-weight="650" fill="#ffffff" text-anchor="start">+30</text><text x="182" y="372" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="start">Sign-in from a country this user never signed in from</text><circle cx="80" cy="394" r="9" fill="#3987e5"/><text x="80" y="398" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="98" y="398" font-size="12.5" font-weight="400" fill="#9a998f" text-anchor="start">08:58</text><text x="144" y="398" font-size="12.5" font-weight="650" fill="#ffffff" text-anchor="start">+10</text><text x="182" y="398" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="start">Sign-in from a device type this user never used</text><circle cx="80" cy="420" r="9" fill="#3987e5"/><text x="80" y="424" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="98" y="424" font-size="12.5" font-weight="400" fill="#9a998f" text-anchor="start">09:40</text><text x="144" y="424" font-size="12.5" font-weight="650" fill="#ffffff" text-anchor="start">+25</text><text x="182" y="424" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="start">First password-only (legacy) sign-in by this user</text><circle cx="80" cy="446" r="9" fill="#3987e5"/><text x="80" y="450" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><text x="98" y="450" font-size="12.5" font-weight="400" fill="#9a998f" text-anchor="start">10:20</text><text x="144" y="450" font-size="12.5" font-weight="650" fill="#ffffff" text-anchor="start">+30</text><text x="182" y="450" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="start">Mail forwarding to another address configured</text><circle cx="80" cy="472" r="9" fill="#d03b3b"/><text x="80" y="476" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">5</text><text x="98" y="476" font-size="12.5" font-weight="400" fill="#9a998f" text-anchor="start">11:15</text><text x="144" y="476" font-size="12.5" font-weight="650" fill="#ffffff" text-anchor="start">+25</text><text x="182" y="476" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="start">File downloads far above this user's normal</text><text x="590" y="372" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="start">None of these alone is worth waking anyone up.</text><text x="590" y="398" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="start">Together, within one morning, they are one alert</text><text x="590" y="424" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="start">an analyst can read and judge in a minute.</text></svg>
