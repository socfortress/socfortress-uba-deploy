<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="432" viewBox="0 0 1060 432" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="How SOCFortress UBA plugs into CoPilot"><title>How SOCFortress UBA plugs into CoPilot</title><rect width="1060" height="432" rx="12" fill="#1a1a19"/><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9a998f"/></marker><marker id="head-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#9a998f"/></marker></defs><text x="24" y="36" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">How SOCFortress UBA plugs into CoPilot</text><rect x="24" y="70" width="176" height="78" rx="10" fill="#242422" stroke="#3a3a37" stroke-width="1"/><text x="38" y="96" font-size="15" font-weight="650" fill="#ffffff" text-anchor="start">Endpoints</text><text x="38" y="120" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="start">Windows, Linux, macOS</text><text x="38" y="139" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="start">(Wazuh agents)</text><rect x="24" y="172" width="176" height="78" rx="10" fill="#242422" stroke="#3a3a37" stroke-width="1"/><text x="38" y="198" font-size="15" font-weight="650" fill="#ffffff" text-anchor="start">Microsoft 365</text><text x="38" y="222" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="start">sign-ins, mail, files,</text><text x="38" y="241" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="start">admin changes</text><rect x="262" y="104" width="176" height="112" rx="10" fill="#242422" stroke="#3a3a37" stroke-width="1"/><text x="276" y="130" font-size="15" font-weight="650" fill="#ffffff" text-anchor="start">Wazuh + Graylog</text><text x="276" y="154" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="start">collect every customer's</text><text x="276" y="173" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="start">events, as today</text><rect x="262" y="300" width="176" height="70" rx="10" fill="#242422" stroke="#3a3a37" stroke-width="1"/><text x="276" y="326" font-size="15" font-weight="650" fill="#ffffff" text-anchor="start">Wazuh indexer</text><text x="276" y="350" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="start">the stored history</text><rect x="548" y="70" width="232" height="180" rx="10" fill="#1d2a3b" stroke="#3987e5" stroke-width="2"/><text x="562" y="96" font-size="15" font-weight="650" fill="#ffffff" text-anchor="start">SOCFortress UBA</text><text x="562" y="114" font-size="11.5" font-weight="400" fill="#9a998f" text-anchor="start">on its own VM</text><text x="562" y="138" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="start">• learns what is normal for</text><text x="572" y="157" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="start">each person and computer</text><text x="562" y="176" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="start">• scores what is new or unusual</text><text x="562" y="195" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="start">• adds risk up, raises alerts</text><rect x="850" y="70" width="186" height="180" rx="10" fill="#242422" stroke="#3a3a37" stroke-width="1"/><text x="864" y="96" font-size="15" font-weight="650" fill="#ffffff" text-anchor="start">CoPilot</text><text x="864" y="120" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="start">• incident alerts</text><text x="864" y="139" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="start">• risk per person</text><text x="864" y="158" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="start">• findings and evidence</text><text x="864" y="177" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="start">• verdicts tune UBA</text><text x="864" y="196" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="start">• one-click setup</text><line x1="200" y1="109" x2="260" y2="140" stroke="#9a998f" stroke-width="1.6" marker-end="url(#head)"/><line x1="200" y1="211" x2="260" y2="182" stroke="#9a998f" stroke-width="1.6" marker-end="url(#head)"/><text x="230" y="104" font-size="11.5" font-weight="400" fill="#9a998f" text-anchor="middle">events</text><line x1="438" y1="160" x2="546" y2="160" stroke="#9a998f" stroke-width="1.6" marker-end="url(#head)"/><text x="492" y="140" font-size="11.5" font-weight="400" fill="#9a998f" text-anchor="middle">copy of</text><text x="492" y="154" font-size="11.5" font-weight="400" fill="#9a998f" text-anchor="middle">behavior events</text><line x1="438" y1="335" x2="600" y2="252" stroke="#9a998f" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#head)"/><text x="560" y="318" font-size="11.5" font-weight="400" fill="#9a998f" text-anchor="start">history to learn from,</text><text x="560" y="333" font-size="11.5" font-weight="400" fill="#9a998f" text-anchor="start">evidence for each finding</text><line x1="780" y1="120" x2="848" y2="120" stroke="#9a998f" stroke-width="1.6" marker-end="url(#head)"/><text x="814" y="110" font-size="11.5" font-weight="400" fill="#9a998f" text-anchor="middle">alerts</text><line x1="780" y1="200" x2="848" y2="200" stroke="#9a998f" stroke-width="1.6" marker-start="url(#head-start)" marker-end="url(#head)"/><text x="814" y="190" font-size="11.5" font-weight="400" fill="#9a998f" text-anchor="middle">API</text><text x="24" y="410" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="start">Setup is one click per customer in CoPilot: it creates the Graylog routing and registers the customer with UBA.</text></svg>
