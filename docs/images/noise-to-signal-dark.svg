<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="290" viewBox="0 0 1060 290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="From noise to a few alerts worth reading"><title>From noise to a few alerts worth reading</title><rect width="1060" height="290" rx="12" fill="#1a1a19"/><text x="24" y="36" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">From noise to a few alerts worth reading</text><text x="24" y="60" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="start">SOCFortress lab, early October 2026: a large Microsoft 365 tenant plus Wazuh endpoints.</text><rect x="24" y="88" width="226" height="150" rx="10" fill="#242422" stroke="#3a3a37" stroke-width="1"/><text x="42" y="140" font-size="34" font-weight="700" fill="#ffffff" text-anchor="start">~500,000</text><text x="42" y="168" font-size="14" font-weight="600" fill="#ffffff" text-anchor="start">events a day</text><text x="42" y="194" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="start">Wazuh and Microsoft 365</text><text x="42" y="212" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="start">events UBA reads</text><path d="M259,151 L275,163 L259,175" fill="none" stroke="#9a998f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="284" y="88" width="226" height="150" rx="10" fill="#242422" stroke="#3a3a37" stroke-width="1"/><text x="302" y="140" font-size="34" font-weight="700" fill="#ffffff" text-anchor="start">~110</text><text x="302" y="168" font-size="14" font-weight="600" fill="#ffffff" text-anchor="start">findings a day</text><text x="302" y="194" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="start">unusual for that person</text><text x="302" y="212" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="start">or computer, with points</text><path d="M519.0,163 L535.0,163 M527.0,155 L527.0,171" stroke="#9a998f" stroke-width="2" stroke-linecap="round"/><rect x="544" y="88" width="226" height="150" rx="10" fill="#242422" stroke="#3a3a37" stroke-width="1"/><text x="562" y="140" font-size="34" font-weight="700" fill="#ffffff" text-anchor="start">~940</text><text x="562" y="168" font-size="14" font-weight="600" fill="#ffffff" text-anchor="start">Wazuh alerts a day</text><text x="562" y="194" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="start">weighed as context,</text><text x="562" y="212" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="start">with capped points</text><path d="M779,151 L795,163 L779,175" fill="none" stroke="#9a998f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="804" y="88" width="226" height="150" rx="10" fill="#1d2a3b" stroke="#3987e5" stroke-width="2"/><text x="822" y="140" font-size="34" font-weight="700" fill="#ffffff" text-anchor="start">14</text><text x="822" y="168" font-size="14" font-weight="600" fill="#ffffff" text-anchor="start">UBA alerts in 5 days</text><text x="822" y="194" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="start">each one a person or</text><text x="822" y="212" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="start">computer and its story</text><text x="24" y="270" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="start">Analysts read alerts, not events: every alert links to the findings and the original records behind it.</text></svg>
